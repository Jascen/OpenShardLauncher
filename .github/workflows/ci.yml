name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Catches a broken macOS launcher before release day: release.yml builds osx on macOS so the SDK ad-hoc signs it
      # (Apple Silicon refuses unsigned code). Published into a temp folder and thrown away; nothing is uploaded.
      - name: Check the macOS launcher publish
        if: runner.os == 'macOS'
        run: |
          out="$RUNNER_TEMP/launcher"
          dotnet publish src/OpenShardLauncher.Client --configuration Release --runtime osx-arm64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:DebugType=embedded --output "$out"
          exe="$(dotnet msbuild src/OpenShardLauncher.Client -getProperty:AssemblyName)"
          codesign --verify --strict --verbose=2 "$out/$exe"
